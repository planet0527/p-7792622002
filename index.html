<style>
:root{
  --bg:#f7f4ee;--card:#fffdf8;--ink:#1f1d1a;--mute:#6f6a60;--line:#e4ddd0;
  --acc:#1f6f68;--accSoft:#d9ece8;--amb:#e09a2d;--ambSoft:#fbe9c9;
  --ok:#2f8a4c;--okSoft:#dcf0e1;--ng:#c4473a;--ngSoft:#f7dcd8;
  --tile:#ffffff;--tileSh:#d6ccb9;--code:#23211d;--codeInk:#ece5d6;--codeCur:#3a3428;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161513;--card:#1f1e1b;--ink:#eee8db;--mute:#a19b8e;--line:#33302a;
  --acc:#5cbcb0;--accSoft:#1d3532;--amb:#f0b452;--ambSoft:#3d311b;
  --ok:#5cc07c;--okSoft:#1c3323;--ng:#e9766a;--ngSoft:#3d211e;
  --tile:#2a2824;--tileSh:#0b0a09;--code:#100f0d;--codeCur:#2f2a20;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 200px}
a{color:var(--acc)}

/* ---------- home ---------- */
.hero{padding:22px 4px 8px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--acc);font-weight:700}
.hero h1{font-size:32px;line-height:1.25;margin:6px 0 8px;font-weight:900;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mute);font-size:15px}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.prog b{font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--acc);color:#fff;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.amb{background:var(--amb);color:#231a08}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.fact b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.fact span{font-size:11px;color:var(--mute)}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}}
.unit{margin:26px 0 8px}
.unit h2{font-size:13px;letter-spacing:.1em;color:var(--mute);margin:0 0 10px;font-weight:700}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.item:active{transform:scale(.99)}
.num{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--bg);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--tileSh)}
.item.done .num{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:700}
.item .t small{display:block;color:var(--mute);font-size:12px;line-height:1.4}
.item .sc{font-size:12px;color:var(--mute);white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.tool b{display:block;font-size:14px}
.tool small{color:var(--mute);font-size:11px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
.top .tt{flex:1;min-width:0}
.top .tt small{display:block;font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.08em}
.top .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- lesson ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.points{margin:0;padding-left:1.2em}
.points li{margin:2px 0}
.trap{background:var(--ambSoft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.trap b{color:var(--amb)}
.grid2{display:grid;gap:12px}.grid2>div{min-width:0}
details.card summary{font-weight:700;cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}details.card summary::after{content:' ＋';color:var(--mute)}details[open].card summary::after{content:' −'}details.card ul{margin-top:8px}
@media (min-width:860px){.grid2{grid-template-columns:1.05fr 1fr;align-items:start}}
.codebox{background:var(--code);color:var(--codeInk);border-radius:16px;padding:10px 0;max-height:27vh;overflow:auto;font-family:"JetBrains Mono","Zen Kaku Gothic New",monospace;font-size:13px;line-height:1.75}
.ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:3px solid transparent;transition:background .2s}
.ln .no{width:34px;flex:none;text-align:right;padding-right:10px;color:#6b6457;user-select:none}
.ln.cur{background:var(--codeCur);border-left-color:var(--amb)}
.ln.cur .no{color:var(--amb)}
.k{color:#7cc4f0;font-weight:600}.ty{color:#c9a0f0}.nm{color:#f5c26b}.st{color:#9fd88a}.op{color:#f08f7c;font-weight:700}.cm{color:#7d776b;font-style:italic}.pt{color:#8fd3c7}
.vis{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:120px}
.vlabel{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:700;margin:2px 0 8px}
.vars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.var{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 3px 0 var(--tileSh);background:var(--tile)}
.var .n{padding:4px 8px;font-size:12px;background:var(--bg);color:var(--mute);font-family:"JetBrains Mono",monospace;display:flex;align-items:center}
.var .v{padding:4px 10px;font-weight:700;font-family:"JetBrains Mono",monospace;min-width:34px;text-align:center}
.var.chg{border-color:var(--amb)}
.var.chg .v{background:var(--ambSoft);animation:pop .4s}
.arr{margin:6px 0 14px;overflow-x:auto;padding-bottom:4px}
.arr .nm2{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute);margin-bottom:2px}
.cells{display:flex;gap:6px;width:max-content}
.col{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px}
.idx{font-size:10px;color:var(--mute);font-family:"JetBrains Mono",monospace}
.cell{width:44px;height:44px;border-radius:9px;background:var(--tile);border:1.5px solid var(--line);box-shadow:0 4px 0 var(--tileSh);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;transition:all .25s}
.cell.hl{border-color:var(--amb);background:var(--ambSoft);transform:translateY(-3px);box-shadow:0 7px 0 var(--tileSh)}
.cell.chg{animation:pop .45s}
.cell.dim{opacity:.28}
.cell.done{background:var(--accSoft);border-color:var(--acc)}
.cell.empty{color:var(--mute);font-weight:400}
.ptr{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--acc);font-weight:700;min-height:16px;text-align:center;line-height:1.2}
.ptr:not(:empty)::before{content:"▲";display:block;font-size:8px}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.calls{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.frame{border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--bg);color:var(--mute)}
.frame.topf{border-color:var(--acc);color:var(--ink);background:var(--accSoft);font-weight:600}
.out{font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--bg);border-radius:10px;padding:6px 10px;border:1px dashed var(--line)}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amb);border-radius:12px;padding:7px 12px;font-size:14px;margin:0;min-height:62px;line-height:1.55}
.msg .sn{display:inline!important;margin-right:8px}
.msg .sn{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em;display:block}
.ctrl{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.ctrl .in{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:center}
.cb{border:1.5px solid var(--line);background:var(--card);border-radius:12px;height:46px;min-width:46px;font-size:17px;font-weight:700}
.cb.main{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-size:15px}
.cb.amb{flex:1;background:var(--amb);border-color:var(--amb);color:#231a08;font-size:15px}
.slider{width:100%;accent-color:var(--acc);margin:0}
.sliderrow{display:none}@media (min-width:700px){.sliderrow{display:block}.codebox{max-height:420px!important}}
details.card{padding:10px 14px}
.stepinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:0 0 4px}
.prose h3{font-size:16px;margin:18px 0 6px}
.prose p,.prose li{font-size:15px}
.prose table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.prose td,.prose th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose th{background:var(--bg);font-weight:700}
.prose code{font-family:"JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:.92em}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:8px 0}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.ng{background:var(--ng)}.dots i.now{background:var(--amb)}
.qtext{font-size:17px;font-weight:700;line-height:1.6;margin:6px 0 10px}
.qcode{background:var(--code);color:var(--codeInk);border-radius:14px;padding:12px 14px;font-family:"JetBrains Mono","Zen Kaku Gothic New",monospace;font-size:13px;white-space:pre;overflow-x:auto;line-height:1.75;margin:0 0 12px}
.choices{display:grid;gap:8px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:0 3px 0 var(--tileSh)}
.ch .lb{width:28px;height:28px;flex:none;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.ch .tx{font-family:"JetBrains Mono","Zen Kaku Gothic New",monospace;white-space:pre-wrap}
.ch.ok{border-color:var(--ok);background:var(--okSoft)}
.ch.ok .lb{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngSoft)}
.ch.ng .lb{background:var(--ng);color:#fff}
.ch:disabled{cursor:default}
.exp{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:15px;background:var(--card);border:1px solid var(--line)}
.exp .v{font-weight:900;font-size:16px;display:block;margin-bottom:4px}
.exp .v.ok{color:var(--ok)}.exp .v.ng{color:var(--ng)}
.result{text-align:center;padding:30px 10px}
.result .big{font-size:56px;font-weight:900;line-height:1;margin:10px 0}
.result p{color:var(--mute)}
.empty-note{color:var(--mute);text-align:center;padding:40px 10px}

/* ===== visual layer ===== */
.cell,.box3{position:relative;box-shadow:none!important;--face:var(--tile);--side:var(--tileSh);--edge:var(--line)}
.cell::before,.box3::before{content:"";position:absolute;left:-1.5px;top:-8px;width:100%;height:7px;background:var(--face);border:1.5px solid var(--edge);border-bottom:0;transform:skewX(-45deg);transform-origin:bottom left;filter:brightness(1.04)}
.cell::after,.box3::after{content:"";position:absolute;right:-9px;top:-5px;width:7px;height:100%;background:var(--side);border:1.5px solid var(--edge);border-left:0;transform:skewY(-45deg);transform-origin:top left}
.cell{width:40px;height:40px;margin:10px 9px 0 0;border-radius:2px}
.cell.hl{--face:var(--ambSoft);--edge:var(--amb);--side:color-mix(in srgb,var(--amb) 55%,#000);transform:translateY(-6px)}
.cell.done{--face:var(--accSoft);--edge:var(--acc);--side:color-mix(in srgb,var(--acc) 55%,#000)}
.cell.dim{opacity:.22}
.col{width:46px}
.cells{gap:6px}
.arcwrap{display:inline-block}
.arc{display:block}
.box3{min-width:44px;height:40px;padding:0 8px;display:grid;place-items:center;background:var(--tile);border:1.5px solid var(--line);font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;margin:10px 10px 0 0;border-radius:2px}
.box3.empty{color:var(--mute);font-weight:400}
.vars{gap:6px 10px;align-items:flex-start}
.var{flex-direction:column;align-items:flex-start;border:0;box-shadow:none;background:transparent;overflow:visible;position:relative}
.var .n{background:transparent;padding:0 2px;font-size:12px;font-weight:700;color:var(--ink)}
.var .old{font-size:11px;color:var(--mute);text-decoration:line-through;height:15px;line-height:15px;font-family:"JetBrains Mono",monospace;padding-left:2px}
.var.chg .box3{--face:var(--ambSoft);--edge:var(--amb);--side:color-mix(in srgb,var(--amb) 55%,#000);background:var(--ambSoft);border-color:var(--amb);animation:drop .45s}
.var.chg .v{background:none}
@keyframes drop{0%{transform:translateY(-14px);opacity:.3}70%{transform:translateY(2px)}100%{transform:none;opacity:1}}
.cond{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:700;animation:pop .35s}
.cond.t{background:var(--okSoft);color:var(--ok)}.cond.f{background:var(--ngSoft);color:var(--ng)}
.cond .cl{font-size:11px;letter-spacing:.1em;opacity:.8}
.cond .ce{flex:1;font-family:"JetBrains Mono",monospace;font-size:17px;color:var(--ink)}
.cond .cv{font-size:18px;font-weight:900}
.ctag,.jtag{margin-left:10px;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;align-self:center;line-height:1.6;font-family:"Zen Kaku Gothic New",sans-serif}
.ctag.t{background:#2f8a4c;color:#fff}.ctag.f{background:#c4473a;color:#fff}
.jtag{background:#e09a2d;color:#231a08}
.ln.prev{background:rgba(255,255,255,.04)}
.ln.prev .no{color:#a89a7a}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:18px 4px;margin-bottom:14px;padding-top:16px}
.node{position:relative;min-width:50px;padding:6px 8px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--tile);text-align:center;font-family:"JetBrains Mono",monospace;line-height:1.2}
.node b{display:block;font-size:16px}
.node .ni{display:block;font-size:10px;color:var(--mute)}
.node.cur{border-color:var(--amb);background:var(--ambSoft);transform:translateY(-3px)}
.node.seen{border-color:var(--acc);background:var(--accSoft)}
.node.end{border-style:dashed;min-width:44px}
.node .np{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--amb)}
.link{color:var(--mute);font-weight:700}
.vstack{display:inline-flex;flex-direction:column;gap:4px;padding:4px 12px 0;border-left:3px solid var(--mute);border-right:3px solid var(--mute);position:relative;margin-left:30px}
.vrow{display:flex;align-items:center;gap:8px;position:relative}
.vrow .idx{position:absolute;left:-44px;width:30px;text-align:right}
.vrow .cell{margin:8px 8px 0 0}
.ptr2{position:absolute;left:72px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--acc);font-family:"JetBrains Mono",monospace}
.vbase{height:3px;background:var(--mute);margin:4px -12px 0}
.ttwrap{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tt{border-collapse:collapse;width:100%;font-family:"JetBrains Mono",monospace;font-size:12px}
.tt th{position:sticky;top:0;background:var(--bg);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--line);text-align:center}
.tt td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:center}
.tt td.lno{color:var(--mute)}
.tt td.chg{font-weight:700}
.tt td.same{color:var(--mute)}
.tt .dot{opacity:.35}
.tt tr.now{background:var(--ambSoft)}
.tt-t{color:var(--ok);font-weight:700}.tt-f{color:var(--ng);font-weight:700}
.diagcard{padding:10px 12px 6px}
.diag{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;font-family:"Zen Kaku Gothic New",sans-serif}
.diagcap{line-height:1.5;text-align:center;font-size:13px;color:var(--mute);margin:2px 0 4px}
.mini{border-collapse:collapse;margin:8px 0 2px;font-family:"JetBrains Mono",monospace;font-size:13px}
.mini td,.mini th{border:1px solid var(--line);padding:2px 10px;text-align:center}
.mini th{background:var(--bg)}
.mini tr:last-child td{background:var(--ambSoft);font-weight:700}

/* ===== zukan ===== */
.zbanner{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:16px 0 0}
.zbanner button{text-align:left;border:0;border-radius:16px;padding:14px;background:var(--acc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.zbanner button+button{background:var(--amb);color:#231a08;box-shadow:0 4px 0 color-mix(in srgb,var(--amb) 55%,#000)}
.zbanner b{display:block;font-size:17px;font-weight:900}
.zbanner span{display:block;font-size:12px;line-height:1.45;opacity:.92;margin-top:2px}
.zsearch{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 10px}
.zchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.zchip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.zchip small{color:var(--mute);font-weight:500}
.zchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.zchip.on small{color:var(--bg);opacity:.7}
.ztoc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.ztoc a{font-size:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.zh{font-size:13px;letter-spacing:.1em;color:var(--mute);margin:24px 0 8px;font-weight:700}
.zc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 14px;scroll-margin-top:70px}
.zc.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--amb)}100%{box-shadow:0 0 0 0 transparent}}
.ztop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ztag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--accSoft);color:var(--acc)}
.zt-sec{background:var(--ngSoft);color:var(--ng)}.zt-al{background:var(--ambSoft);color:var(--amb)}.zt-ts{background:var(--okSoft);color:var(--ok)}.zt-ds{background:var(--accSoft);color:var(--acc)}.zt-syn{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.zlink{border:1.5px solid var(--acc);color:var(--acc);background:transparent;border-radius:99px;font-size:12px;font-weight:700;padding:2px 10px}
.zc h3{font-size:19px;font-weight:900;margin:6px 0 8px;line-height:1.35}
.zfig{background:var(--bg);border-radius:14px;padding:10px 6px;margin-bottom:10px}
.zfig .diag{max-width:460px}
.zpoint{font-weight:700;font-size:15.5px;margin:0 0 8px;background:linear-gradient(transparent 62%,var(--ambSoft) 62%)}
.zan{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 8px}
.zan span{display:inline-block;font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:6px;padding:0 7px;margin-right:6px}
.zb{margin:0 0 6px;padding-left:1.2em;font-size:14.5px}.zb li{margin:2px 0}
.glist{display:grid;gap:6px}
.gi{display:grid;grid-template-columns:1fr auto;gap:0 10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px}
.gi b{font-size:15px}.gi small{grid-column:1;color:var(--acc);font-size:11px;font-family:"JetBrains Mono",monospace}
.gi span{grid-column:1;font-size:13px;color:var(--mute);line-height:1.5}
.gi i{grid-column:2;grid-row:1/span 3;align-self:center;font-style:normal;font-size:12px;color:var(--acc);font-weight:700}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}

.welcome{background:var(--card);border:2px solid var(--acc);border-radius:18px;padding:16px;margin:18px 0 0}
.welcome>b{font-size:17px;font-weight:900}
.welcome p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wopts button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--tileSh)}
.wopts span{font-size:20px;display:block}
.wopts b{display:block;font-size:14px}
.wopts small{display:block;font-size:11.5px;color:var(--mute);line-height:1.45}
.about p{font-size:14px;margin:0 0 8px}
.resetrow{margin-top:6px}
.resetrow .btn{font-size:13px;padding:8px 14px}
.confirm{margin-top:10px;background:var(--ngSoft);border-radius:12px;padding:10px 12px}
.confirm p{margin:0 0 8px;font-size:14px}
.confirm .btn{font-size:13px;padding:8px 14px}

.savest{display:block;width:100%;text-align:left;border:0;background:var(--okSoft);color:var(--ok);font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;margin:2px 0 0}
.savest.ng{background:var(--ngSoft);color:var(--ng)}
.warnc{background:var(--ngSoft);color:var(--ng);font-weight:700;font-size:14px}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.ks{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.ks b{display:block;font-size:24px;font-weight:900;line-height:1.2}.ks b small{font-size:12px;font-weight:700;color:var(--mute);margin-left:1px}
.ks span{font-size:11px;color:var(--mute)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.dd{text-align:center}.dd i{display:block;height:26px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.dd.on i{background:var(--acc);border-color:var(--acc)}.dd.today i{outline:2px solid var(--amb);outline-offset:1px}
.dd span{font-size:8px;color:var(--mute);display:block;margin-top:2px;white-space:nowrap}
.lsc{display:grid;gap:4px}
.lsc button{display:grid;grid-template-columns:1fr 70px 38px;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:3px 0;font-size:13px}
.lsc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsc i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.lsc em{display:block;height:100%;border-radius:99px}
.lsc b{font-family:"JetBrains Mono",monospace;font-size:12px;text-align:right}
.hist div{display:grid;grid-template-columns:78px 1fr auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.hist .ht{color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.hist .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist b{font-family:"JetBrains Mono",monospace}.hist b.ok{color:var(--ok)}.hist b.mid{color:var(--amb)}.hist b.ng{color:var(--ng)}
.muted{color:var(--mute);font-size:14px}
.bk p{font-size:14px;margin:0 0 8px}.bk p.small{font-size:12.5px;color:var(--mute)}
.bkrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.bkrow .btn{font-size:14px;padding:10px 14px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.bkta{width:100%;min-height:74px;font-family:"JetBrains Mono",monospace;font-size:11px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink);word-break:break-all;margin:4px 0}
.bkmsg{font-size:13px;font-weight:700;min-height:0}.bkmsg.ok{color:var(--ok)}.bkmsg.ng{color:var(--ng)}

.cb.on{background:var(--ambSoft);border-color:var(--amb)}
.popts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.popts button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px}
.popts button.ok{background:var(--okSoft);border-color:var(--ok)}.popts button.ng{background:var(--ngSoft);border-color:var(--ng)}
.pfb{display:inline-block;font-size:12px;font-weight:900;color:var(--ng);margin-right:8px}.pfb.ok{color:var(--ok)}
.daily{display:block;width:100%;text-align:left;margin:16px 0 0;border:2px solid var(--amb);background:var(--ambSoft);border-radius:16px;padding:12px 14px}
.daily.done{border-color:var(--ok);background:var(--okSoft)}
.daily .dl{font-size:12px;font-weight:900;color:var(--amb)}.daily.done .dl{color:var(--ok)}
.daily b{display:block;font-size:15px;line-height:1.5;margin:2px 0}
.daily small{color:var(--mute);font-size:11.5px}
.tool.hl{border:2px solid var(--amb)}
.mopts{display:grid;gap:10px}
.mopt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 4px 0 var(--tileSh)}
.mopt.big{border:2px solid var(--acc)}
.mopt b{display:block;font-size:18px;font-weight:900}.mopt span{display:block;font-size:15px;font-weight:700;color:var(--acc)}
.mopt small{display:block;color:var(--mute);font-size:12px}.mopt i{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;background:var(--okSoft);color:var(--ok);border-radius:6px;padding:0 8px}
.mtop{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mtop .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 6px}
.mtop b{font-size:24px;font-weight:900}
.mpace{flex:1;font-size:12px;font-weight:700}.mpace.ok{color:var(--ok)}.mpace.ng{color:var(--ng)}
.msub{border:0;background:var(--amb);color:#231a08;font-weight:900;border-radius:10px;padding:6px 14px}
.mbarw{height:4px;background:var(--line)}.mbarw i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.ch.sel{border-color:var(--acc);background:var(--accSoft)}.ch.sel .lb{background:var(--acc);color:#fff}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0}
.pal button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.pal button.done{background:var(--accSoft);border-color:var(--acc)}.pal button.now{outline:2px solid var(--amb);outline-offset:1px}
.mrev{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:8px 12px;margin:6px 0}
.mrev.ng{border-left-color:var(--ng)}
.mrev summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none;font-size:14px}
.mrev summary::-webkit-details-marker{display:none}
.mrev .mk{font-weight:900;width:16px}.mrev.ok .mk{color:var(--ok)}.mrev.ng .mk{color:var(--ng)}
.mrev .mq{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrev .mt{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute)}
.mrev p{font-size:14px;margin:6px 0}.mca b{color:var(--ok)}
.tfig{margin-top:12px;border:1.5px solid var(--acc);border-radius:16px;padding:12px 12px 8px;background:var(--card)}
.tfh{font-size:13px;font-weight:900;color:var(--acc);margin-bottom:6px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tchip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tbody .zfig{margin-bottom:8px}
.tbody .zpoint{font-size:14.5px}
.tmore summary{font-size:13px;font-weight:700;color:var(--acc);cursor:pointer;margin:4px 0}
/* ===================== theme: トレースノート ===================== */
:root{
  --bg:#f1f4f7;--grid:#e2e8ee;--card:#ffffff;--ink:#1a2438;--mute:#5d6878;--line:#d5dce4;
  --acc:#2348c4;--accSoft:#e4eafb;--amb:#8a6200;--ambSoft:#ffe866;--hl:#ffe55c;
  --ok:#13814f;--okSoft:#ddf3e6;--ng:#cf2a3c;--ngSoft:#fde4e7;
  --tile:#ffffff;--tileSh:#c4cdd8;--code:#17213a;--codeInk:#e7ecf5;--codeCur:rgba(255,229,92,.14);
  --fd:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101726;--grid:#18223a;--card:#172036;--ink:#e8edf7;--mute:#9aa6bb;--line:#2a3652;
  --acc:#8ea7ff;--accSoft:#1e2b52;--amb:#ffd84d;--ambSoft:#4a3f10;--hl:#ffd84d;
  --ok:#5fd39a;--okSoft:#123526;--ng:#ff7b88;--ngSoft:#3d1820;
  --tile:#1d2842;--tileSh:#0a0f1b;--code:#0c1222;--codeCur:rgba(255,216,77,.13);
}}
html,body{background-color:var(--bg)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed;font-size:15.5px}
h1,h2,h3,.top .tt b,.result .big,.ks b,.fact b,.nextup h2,.zc h3,.qtext{font-family:var(--fd)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px}
@media (min-width:860px){.wrap{max-width:980px}}

/* buttons */
.btn{border-radius:12px;background:var(--acc);box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.btn.ghost{background:var(--card);box-shadow:0 2px 0 var(--line)}
.btn.amb{background:var(--hl);color:#2a2200;box-shadow:0 3px 0 #b89a17}
.btn.big{width:100%;padding:15px 18px;font-size:16px}

/* top bar */
.top{background:color-mix(in srgb,var(--bg) 90%,transparent)}
.top .tt small{letter-spacing:0;font-size:11.5px;color:var(--mute);font-weight:700}
.top .tt b{font-size:17px;font-weight:800}
.back{border-radius:12px;background:var(--card)}

/* ---------- home ---------- */
.home .hero{padding:18px 2px 0}
.home .sub0{margin:0;font-size:13px;font-weight:700;color:var(--acc)}
.home h1{font-size:34px;font-weight:800;margin:2px 0 6px;line-height:1.2;letter-spacing:.01em}
.home .lead{margin:0;font-size:14.5px;color:var(--mute);line-height:1.7;max-width:34em}
.hero-cubes{max-width:330px!important;margin:12px 0 4px!important}
.nextup{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 16px 16px;margin:14px 0 10px;box-shadow:4px 4px 0 var(--ink)}
.nu-top{display:flex;justify-content:space-between;align-items:center}
.nu-tag{font-size:13px;font-weight:800;background:var(--hl);color:#2a2200;padding:1px 10px;border-radius:4px;transform:rotate(-1.5deg);display:inline-block}
.nu-prog{font-size:12.5px;color:var(--mute);font-weight:700}
.nu-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}.nu-bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.nu-unit{margin:0;font-size:12.5px;color:var(--mute);font-weight:700}
.nextup h2{font-size:23px;font-weight:800;margin:2px 0 4px;line-height:1.35}
.nu-sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.nextup.welcome h2{font-size:20px}.nextup.welcome>p{color:var(--mute);font-size:14px;margin:2px 0 12px}
.wopts button{background:var(--bg);border-radius:12px;box-shadow:none;border:1.5px solid var(--line)}
.wopts button:active{border-color:var(--acc)}
.savest{display:flex;justify-content:space-between;gap:8px;align-items:center;background:transparent;color:var(--ok);padding:4px 2px;font-size:12px}
.savest b{color:var(--ng);font-size:12.5px;white-space:nowrap}
.daily{border-radius:16px;border:1.5px solid var(--line);background:var(--card);margin:10px 0 0;position:relative;overflow:hidden;padding:12px 14px 12px 18px}
.daily::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--hl)}
.daily .dl{color:var(--amb);font-weight:800}.daily.done{background:var(--card);border-color:var(--line)}.daily.done::before{background:var(--ok)}
.sec{margin:30px 0 0}
.sh{font-size:18px;font-weight:800;margin:0 0 10px;color:var(--ink);letter-spacing:0}
/* learning path */
.path{list-style:none;margin:0;padding:0 0 0 2px;position:relative}
.path::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:3px}
.pu{position:relative;padding:14px 0 6px 46px}
.pu-name{font-size:13px;font-weight:800;color:var(--mute);background:var(--bg);padding:0 4px}
.pn{position:relative;margin:4px 0}
.pn button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:6px 6px 6px 0;border-radius:12px}
.pn button:active{background:var(--card)}
.pn .dot{position:relative;z-index:1;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--card);border:2.5px solid var(--line);color:var(--mute);font-family:var(--fd)}
.pn.done .dot{background:var(--acc);border-color:var(--acc);color:#fff}
.pn.now .dot{background:var(--hl);border-color:var(--ink);color:#2a2200;box-shadow:0 0 0 5px color-mix(in srgb,var(--hl) 45%,transparent)}
.pn .t{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.pn.now .t{border:2px solid var(--ink)}
.pn .t b{display:block;font-size:15px;font-weight:700}
.pn .t small{display:block;font-size:12px;color:var(--mute);line-height:1.45}
.pn .sc{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap}
.pn .here{font-size:11.5px;font-weight:800;background:var(--hl);color:#2a2200;border-radius:4px;padding:1px 6px;white-space:nowrap}
/* tools */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.tool{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);box-shadow:none}
.tool .ti{display:block;font-size:22px;line-height:1.2;margin-bottom:4px}
.tool b{font-size:14.5px;font-weight:800}
.tool small{display:block;font-size:11.5px;line-height:1.45;color:var(--mute)}
.tool.main{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tool.alert small{color:var(--ng);font-weight:700}
@media (max-width:420px){.tools{grid-template-columns:1fr 1fr}.tools .tool.main{grid-column:1/-1}}
.facts{margin:0}.fact{border-radius:12px;background:var(--card)}.fact b{font-weight:800}
.about{border-radius:16px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1.5px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:11px;font-weight:700;color:var(--mute);border-radius:12px}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{background:var(--hl);border-radius:8px;padding:1px 6px;width:35px;color:#2a2200}
body.has-tabs .wrap{padding-bottom:110px}

/* ---------- lesson ---------- */
.phase{position:sticky;top:61px;z-index:4;display:flex;gap:4px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.phase a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 4px;cursor:pointer;white-space:nowrap}
.phase a i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-family:var(--fd)}
.phase a[data-q] {background:var(--hl);border-color:var(--ink);color:#2a2200}
.phase a[data-q] i{background:#2a2200;color:var(--hl)}
.diagcard{border-radius:18px;border:1.5px solid var(--line)}
.diagcap{color:var(--ink);font-weight:700;font-size:13.5px}
details.card{border-radius:14px}
.trap{background:color-mix(in srgb,var(--hl) 30%,var(--card));border-left:4px solid var(--hl);border-radius:8px}

<body>
<div id="app"></div>
<div id="ctrl"></div>
<script>
/* ================= utilities ================= */
const app=document.getElementById('app'), ctrl=document.getElementById('ctrl');
const L=s=>s.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KANA=['ア','イ','ウ','エ','オ'];
const blankP=()=>({done:{},best:{},wrong:[],seen:false,hist:[],days:{},updated:0});
let P=blankP();let STORE_OK=true;
try{const s=localStorage.getItem('feb-zero-v1');if(s)P=Object.assign(blankP(),JSON.parse(s));localStorage.setItem('feb-zero-test','1');localStorage.removeItem('feb-zero-test');}catch(e){STORE_OK=false}
function save(){P.updated=Date.now();try{localStorage.setItem('feb-zero-v1',JSON.stringify(P));STORE_OK=true}catch(e){STORE_OK=false}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(x=>{if(!x)navigator.storage.persist()}).catch(()=>{})}catch(e){}
const dkey=(d)=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function markDay(){P.days[dkey()]=(P.days[dkey()]||0)+1}
function streak(){let n=0;const d=new Date();if(!P.days[dkey(d)])d.setDate(d.getDate()-1);while(P.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
const fmtTime=ts=>{if(!ts)return '—';const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=v=>v===null||v===undefined?'—':typeof v==='string'?'"'+v+'"':(typeof v==='number'&&v<0?'−'+Math.abs(v):String(v));
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};

/* ---- pseudo-code highlighter ---- */
const TY=['整数型の配列','実数型の配列','文字列型の配列','整数型','実数型','文字列型','論理型','大域','未定義の値'];
const KW=['elseif','endif','endwhile','endfor','if','else','while','for','do','return','and','or','not','mod'];
const RE=new RegExp('("[^"]*")|('+TY.join('|')+')|\\b('+KW.join('|')+')\\b|(←|○|÷|×|−|＋|≤|≥|≠)|(\\d+)|(を|から|まで|ずつ増やす|ずつ減らす|の要素数|の商)','g');
function hi(line){
  let c=line,cm='';const k=line.indexOf('//');
  if(k>=0){c=line.slice(0,k);cm=line.slice(k)}
  c=esc(c).replace(RE,(m,s,t,kw,op,n,pt)=>s?'<span class="st">'+s+'</span>':t?'<span class="ty">'+t+'</span>':kw?'<span class="k">'+kw+'</span>':op?'<span class="op">'+op+'</span>':n?'<span class="nm">'+n+'</span>':'<span class="pt">'+pt+'</span>');
  return c+(cm?'<span class="cm">'+esc(cm)+'</span>':'');
}

/* ---- trace recorder ---- */
function rec(){
  const st={v:{},a:{},p:{},dim:{},done:{},hl:{},calls:[],out:null,chain:null,vert:[]};const steps=[];
  const S=(line,msg,x)=>{steps.push({line,msg,x:x||{},s:JSON.parse(JSON.stringify(st))});st.hl={}};
  return {st,S,steps};
}

/* ================= lessons ================= */
const UNITS=[
 {name:'0. はじめに',ids:['intro']},
 {name:'1. 擬似言語を読めるようになる',ids:['var','if','while','for','array','func']},
 {name:'2. 定番アルゴリズム',ids:['max','linear','binary','bubble','select','recur','intcalc']},
 {name:'3. データ構造',ids:['stack','queue','list']},
 {name:'4. 情報セキュリティ(問17〜20)',ids:['sec']}
];

const LESSONS={};
function def(o){LESSONS[o.id]=o}

/* ---------- 0 intro ---------- */
def({id:'intro',title:'科目Bってどんな試験？',sub:'試験の形と、つまずきやすいポイント、このアプリの使い方',
html:`
<h3>試験の形</h3>
<table><tr><th>問題数</th><td>20問(全問必須)</td></tr>
<tr><th>時間</th><td>100分 → <b>1問あたり約5分</b></td></tr>
<tr><th>内訳</th><td>問1〜16：アルゴリズムとプログラミング(擬似言語)<br>問17〜20：情報セキュリティ</td></tr>
<tr><th>合格</th><td>1000点満点中 600点以上(IRT方式なので単純な正答率ではないが、目安は6割強)</td></tr></table>
<h3>点が取れない典型パターン</h3>
<ul>
<li><b>擬似言語の記号が読めない</b>…「←」「mod」「の商」「要素番号は1から」を知らないと、そもそも何をしているか分からない</li>
<li><b>頭の中だけで追う</b>…変数が3つを超えると人間の脳では無理。途中で値を見失う</li>
<li><b>定番アルゴリズムを知らない</b>…二分探索やソートを初見で読むと5分では終わらない</li>
</ul>
<h3>最重要スキル＝トレース</h3>
<p>トレースとは、プログラムを<b>1行ずつ実行したつもりで、変数の値を紙に書き出していく</b>こと。科目Bの問題の大半は、これを丁寧にやれば解けます。</p>
<table><tr><th>行</th><th>n</th><th>total</th></tr>
<tr><td>n ← 1</td><td>1</td><td>—</td></tr>
<tr><td>total ← 0</td><td>1</td><td>0</td></tr>
<tr><td>total ← total + n</td><td>1</td><td>1</td></tr>
<tr><td>n ← n + 1</td><td>2</td><td>1</td></tr></table>
<p>こんな表を、値が変わるたびに1行ずつ書き足していくだけ。</p>
<h3>このアプリの使い方</h3>
<ol>
<li>各レッスンの<b>ステップ実行</b>で、コードが1行ずつ動く様子を見る(黄色＝今の行、オレンジ＝値が変わった変数)</li>
<li>余裕があれば、紙とペンで同じトレースをしてみる</li>
<li>慣れてきたら、レッスン画面の <b>🤔 ボタン</b>で「予想モード」に。値が変わる前に「次はいくつ？」と聞かれます</li>
<li>最後の<b>確認問題</b>で、本番形式の問題を解く</li>
<li>問題の読み方やワナは、ホームの「調べる」にある<b>解き方ガイド</b>にまとめています</li>
<li>間違えた問題は自動で「復習」に入る</li>
<li>仕上げは<b>⏱ 模擬試験</b>。1問5分のペースで解く練習をする</li>
</ol>`,
quiz:[
 {q:'科目Bの20問のうち、アルゴリズムとプログラミング(擬似言語)の問題は何問？',c:['16問','4問','10問','20問'],e:'問1〜16の16問がアルゴリズムとプログラミング、問17〜20の4問が情報セキュリティ。アルゴリズムが8割なので、ここが読めるかどうかで勝負が決まる。'},
 {q:'1問あたりにかけられる時間の目安は？',c:['約5分','約1分','約10分','約20分'],e:'100分 ÷ 20問 = 5分。分からない問題で15分粘るより、トレースで確実に取れる問題を拾う方が点になる。'}
]});

/* ---------- 1 var ---------- */
def({id:'var',title:'変数と代入「←」',sub:'箱に値を入れる。上書きしたら古い値は消える',
pts:['「x ← 5」は「x という箱に 5 を入れる」','右辺を先に計算してから、左辺に入れる','「x ← x + 1」は数学の等式ではなく「x を1増やす」','新しい値を入れると、古い値は消える'],
trap:'「=」は代入ではなく「等しいか？」の比較。代入は必ず「←」。',
code:L(`
整数型: x ← 3
整数型: y ← 5
x ← x + y
y ← x − y
x ← x − y
`),
run(){const {st,S,steps}=rec();
 st.v.x=3;S(0,'整数型の変数 x を用意し、3 を入れる。「←」は「右の値を左の箱に入れる」記号。');
 st.v.y=5;S(1,'同じように y に 5 を入れる。');
 st.v.x=8;S(2,'まず右辺 x + y = 3 + 5 = 8 を計算。それを x に入れる。x にあった 3 は上書きされて消える。');
 st.v.y=3;S(3,'右辺 x − y = 8 − 5 = 3 を y に入れる。');
 st.v.x=5;S(4,'右辺 x − y = 8 − 3 = 5 を x に入れる。最初 x=3, y=5 だったのが x=5, y=3 に入れ替わった！');
 return steps;},
quiz:[
 {q:'次のプログラムを実行した後の a と b の値は？',code:`整数型: a ← 2
整数型: b ← 7
a ← b
b ← a`,c:['a = 7, b = 7','a = 7, b = 2','a = 2, b = 2','a = 2, b = 7'],e:'3行目で a に 7 が入った瞬間、元の 2 は消える。4行目の b ← a は「今の a＝7」を入れるので b も 7。値を入れ替えたいなら、tmp などの退避用の変数が必要(ソートのレッスンで出てくる)。'},
 {q:'実行後の n の値は？',code:`整数型: n ← 10
n ← n × 2
n ← n − 3
n ← n mod 4`,c:['1','17','4','0'],e:'10 → 20 → 17。mod は「割った余り」なので 17 mod 4 = 1(17 = 4×4 + 1)。'}
]});

/* ---------- 2 if ---------- */
def({id:'if',title:'条件分岐 if',sub:'上から順に条件を見て、最初に真になった所だけ実行',
pts:['if (条件) が真なら中を実行、偽なら飛ばす','elseif は「前の条件が偽だったときだけ」チェックされる','どれか1つを実行したら、残りは見ずに endif の後へ','else は「どれも偽だったとき」'],
trap:'score が 95 でも「score ≥ 60」は真だが、先に「score ≥ 80」が真になるので B にはならない。上から順、最初の1つだけ。',
code:L(`
整数型: score ← 72
文字列型: r
if (score ≥ 80)
  r ← "A"
elseif (score ≥ 60)
  r ← "B"
else
  r ← "C"
endif
`),
run(){const {st,S,steps}=rec();
 st.v.score=72;S(0,'score に 72 を入れる。');
 st.v.r=null;S(1,'文字列型の r を宣言。まだ何も入っていない(—で表示)。');
 S(2,'72 ≥ 80 は偽。だから中身(4行目)は実行せず、次の elseif へ。',{cond:['72 ≥ 80',false]});
 S(4,'72 ≥ 60 は真！ この中を実行する。',{cond:['72 ≥ 60',true]});
 st.v.r='B';S(5,'r に "B" を入れる。');
 S(8,'1つ実行したので、残りの else は見ずに endif の後へ抜ける。結果 r = "B"。');
 return steps;},
quiz:[
 {q:'上のレッスンのプログラムで score ← 95 にしたら、r はどうなる？',c:['"A"','"B"','"A" と "B" の両方','"C"'],e:'95 ≥ 80 が真なので "A" を入れて終了。95 ≥ 60 も真だが、elseif は「前の条件が偽のときだけ」見るので実行されない。'},
 {q:'x ← 9 のとき、実行後の y は？',code:`if (x mod 3 = 0 and x mod 5 = 0)
  y ← 1
elseif (x mod 3 = 0)
  y ← 2
else
  y ← 3
endif`,c:['2','1','3','未定義'],e:'9 mod 3 = 0 は真、9 mod 5 = 4 なので「= 0」は偽。and は両方真のときだけ真なので、1つ目は偽。次の elseif で 9 mod 3 = 0 は真 → y ← 2。'}
]});

/* ---------- 3 while ---------- */
def({id:'while',title:'繰返し while',sub:'条件が真の間ずっと回る。終わったときの値に注意',
pts:['while (条件) の条件を毎回チェック','真なら中を実行して、また条件に戻る','偽になったらループを抜けて endwhile の後へ','do 〜 while (条件) は「先に1回実行してから」条件を見る(最低1回は実行)'],
trap:'ループが終わったときの変数の値は「条件が偽になった値」。下の例では n は 4 ではなく 5 で終わる。',
code:L(`
整数型: n ← 1
整数型: total ← 0
while (n ≤ 4)
  total ← total + n
  n ← n + 1
endwhile
`),
run(){const {st,S,steps}=rec();let n=1,t=0;
 st.v.n=1;S(0,'n に 1 を入れる。');
 st.v.total=0;S(1,'total(合計)を 0 で用意。合計を作るときは 0 から始めるのが定番。');
 while(true){
  if(n<=4)S(2,n+' ≤ 4 は真 → ループの中へ。',{cond:[n+' ≤ 4',true]});
  else{S(2,n+' ≤ 4 は偽 → ループを抜ける。',{cond:[n+' ≤ 4',false]});break}
  t+=n;st.v.total=t;S(3,'total ← '+(t-n)+' + '+n+' = '+t);
  n++;st.v.n=n;S(4,'n を1増やして '+n+'。→ while の行に戻って条件をもう一度チェック。');
 }
 S(5,'終了。total = 10(1+2+3+4)。n は 4 ではなく 5 になっている点に注意！');
 return steps;},
quiz:[
 {q:'上のレッスンのプログラムが終了したとき、n の値は？',c:['5','4','10','1'],e:'n=4 のとき条件は真で中を実行し、n が 5 になる。そこで 5 ≤ 4 が偽になって終わるので、n は 5。この「1つずれ」は本番でよく狙われる。'},
 {q:'実行後の c の値は？',code:`整数型: k ← 1
整数型: c ← 0
while (k < 20)
  k ← k × 2
  c ← c + 1
endwhile`,c:['5','4','6','16'],e:'k の変化：1→2→4→8→16→32。k が 16 のときはまだ 16 < 20 で真なので、もう1回回って 32 になる。回った回数＝c＝5。'},
 {q:'実行後の x の値は？(do 〜 while は先に中身を実行し、最後に条件を見る)',code:`整数型: x ← 10
do
  x ← x − 4
while (x > 0)`,c:['−2','2','6','0'],e:'10→6(6>0 真、続ける)→2(2>0 真、続ける)→−2(−2>0 偽、終了)。条件チェックが後ろにあるので、2 のときもう1回実行される。'}
]});

/* ---------- 4 for ---------- */
def({id:'for',title:'繰返し for',sub:'「i を 1 から n まで 1 ずつ増やす」を読めるように',
pts:['for (i を 開始 から 終了 まで 増分 ずつ増やす)','i が終了値を超えたら終わり','「ずつ減らす」なら下に向かって数える','二重ループは「外側1回につき内側が全部回る」'],
trap:'「2 ずつ増やす」だと i は 1, 3, 5, … と飛ぶ。何回回るかを数える問題が頻出。',
code:L(`
整数型: i
整数型: total ← 0
for (i を 1 から 9 まで 2 ずつ増やす)
  total ← total + i
endfor
`),
run(){const {st,S,steps}=rec();let t=0;
 st.v.i=null;S(0,'ループ用の変数 i を宣言。');
 st.v.total=0;S(1,'total を 0 で用意。');
 for(let i=1;i<=9;i+=2){st.v.i=i;
  S(2,i===1?'i に 1 を入れてスタート。1 ≤ 9 なので中へ。':'i を 2 増やして '+i+'。'+i+' ≤ 9 なので中へ。',{cond:[i+' ≤ 9',true]});

def({id:'func',title:'関数と手続き',sub:'○で始まる部品。呼び出すと中に入り、return で戻る',

trap:'関数の中で呼び出しが入れ子になったら、「どこで待っているか」を見失わないように、呼び出しの積み重なり(右の箱)を書き出す。',
code:L(`
○整数型: twice(整数型: n)
  return n × 2

○整数型: calc(整数型: x)

// 呼出し: 整数型: ans ← calc(3)
`),
run(){const {st,S,steps}=rec();

 S(4,'y ← twice(x)。右辺を計算するため、twice(3) を呼ぶ。calc はここで一時停止。');
 st.calls.push('twice(n=3)');st.v={n:3};S(0,'twice の中へ。n に 3 が入る。');
 S(1,'n × 2 = 6 を return。twice は終わり、呼んだ所に戻る。');

 S(5,'twice(y) = twice(6) を呼ぶ。');
 st.calls.push('twice(n=6)');st.v={n:6};S(0,'twice の中へ。n に 6 が入る。');
 S(1,'6 × 2 = 12 を return。');
 st.calls.pop();st.v={x:3,y:6};S(5,'戻ってきた 12 に 1 を足して 13 を return。');
 st.calls.pop();st.v={ans:13};S(7,'メインに戻り、ans に 13 が入る。');

def({id:'max',title:'合計・最大値',sub:'全アルゴリズムの基本形。暫定チャンピオン方式',
pts:['最大値：先頭を「暫定の最大」にして、2番目から順に比べる','より大きいのが来たら入れ替える','合計：0 から始めて、全部足していく','不等号の向きを変えると最小値になる'],
trap:'穴埋めで「max ← a[i]」と「a[i] ← max」を入れ替えた選択肢がよく出る。代入の向きに注意。',
code:L(`
○整数型: findMax(整数型の配列: a)
  整数型: max ← a[1]
  整数型: i
  for (i を 2 から aの要素数 まで 1 ずつ増やす)
    if (a[i] > max)
      max ← a[i]
    endif
  endfor
  return max
`),
run(){const {st,S,steps}=rec();const a=[4,7,2,9,5];let max;
 st.a.a=a.slice();S(0,'a = {4, 7, 2, 9, 5} で呼び出す。最大値 9 を見つけたい。');
 max=a[0];st.v.max=max;st.hl.a=[1];S(1,'とりあえず先頭の 4 を「暫定の最大値」にする。');
 st.v.i=null;S(2,'i を宣言。');
 for(let i=2;i<=5;i++){st.v.i=i;st.p.a={i};
  S(3,'i = '+i+'。'+i+'番目を調べる。');
  const t=a[i-1]>max;st.hl.a=[i];S(4,'a['+i+'] = '+a[i-1]+' > max = '+max+' は'+(t?'真！':'偽。'),{cond:[a[i-1]+' > '+max,t]});
  if(t){max=a[i-1];st.v.max=max;st.hl.a=[i];S(5,'max を '+max+' に更新。新チャンピオン。')}
 }
 st.p.a={};S(8,'全部調べ終わった。return 9。');
 return steps;},
quiz:[
 {q:'上の findMax の「a[i] > max」を「a[i] < max」に変えると、何を返す関数になる？',c:['最小値','最大値','先頭の値','合計'],e:'「今の暫定値より小さいのが来たら更新」になるので、最後に残るのは最小値。変数名は max のままでも中身は最小値。名前に惑わされず、処理を読む。'},
 {q:'配列の合計を返す関数。[ ア ] に入るものは？',code:`○整数型: sum(整数型の配列: a)
  整数型: s ← 0
  整数型: i
  for (i を 1 から aの要素数 まで 1 ずつ増やす)
    [ ア ]
  endfor
  return s`,c:['s ← s + a[i]','s ← a[i]','s ← s + i','a[i] ← s + a[i]'],e:'s に今までの合計が入っているので、そこに a[i] を足して s に戻す。「s ← s + i」は番号(1,2,3…)を足してしまう、よくある引っかけ。'}
]});

run(){const {st,S,steps}=rec();const a=[6,3,8,1,7];

/* ---------- 9 binary ---------- */
def({id:'binary',title:'二分探索',sub:'真ん中を見て、半分を捨てる。整列済みが前提',
pts:['配列が小さい順に並んでいることが前提','low〜high が「まだ探す範囲」','真ん中 mid を見て、目的の値より小さければ右半分、大きければ左半分を残す','1回で範囲が半分になるので、とても速い'],
trap:'「(low + high) ÷ 2 の商」は小数を切り捨てた整数。(5 + 8) ÷ 2 の商 = 6。low ← mid + 1 の「+1」を忘れた選択肢に注意。',
code:L(`
○整数型: binSearch(整数型の配列: a, 整数型: target)
  整数型: low ← 1
  整数型: high ← aの要素数
  整数型: mid
  while (low ≤ high)
    mid ← (low + high) ÷ 2 の商
    if (a[mid] = target)
      return mid
    elseif (a[mid] < target)
      low ← mid + 1
    else
      high ← mid − 1
    endif
  endwhile
  return −1
`),
run(){const {st,S,steps}=rec();const a=[2,5,8,12,16,23,38,45],t=38,n=8;
 const dim=(lo,hi)=>range(1,n).filter(k=>k<lo||k>hi);
 st.a.a=a.slice();st.v.target=t;S(0,'整列済みの a から 38 を探す。');
 let low=1,high=n,mid=null;st.v.low=low;st.p.a={low};S(1,'low = 1(探す範囲の左端)。');
 st.v.high=high;st.p.a={low,high};S(2,'high = 8(右端)。今は全体が探す範囲。');
 st.v.mid=null;S(3,'mid を宣言。');
 while(true){
  if(low<=high)S(4,low+' ≤ '+high+' は真 → まだ探す範囲が残っている。',{cond:[low+' ≤ '+high,true]});
  else{S(4,'偽 → 範囲が無くなった。',{cond:[low+' ≤ '+high,false]});break}
  mid=Math.floor((low+high)/2);st.v.mid=mid;st.p.a={low,mid,high};st.hl.a=[mid];
  S(5,'('+low+' + '+high+') ÷ 2 = '+((low+high)/2)+' → 商は '+mid+'。真ん中は '+mid+' 番目。');
  st.hl.a=[mid];const eq=a[mid-1]===t;S(6,'a['+mid+'] = '+a[mid-1]+' は 38？ → '+(eq?'等しい！':'違う。'),{cond:[a[mid-1]+' = 38',eq]});
  if(eq){st.hl.a=[mid];S(7,'見つかった！ return '+mid+'。たった3回の比較で発見。');break}
  st.hl.a=[mid];
  if(a[mid-1]<t){S(8,a[mid-1]+' < 38 は真 → 38 はもっと右にある。',{cond:[a[mid-1]+' < 38',true]});
   low=mid+1;st.v.low=low;st.p.a={low,high};st.dim.a=dim(low,high);S(9,'low ← '+mid+' + 1 = '+low+'。'+mid+'番目より左は全部捨てる。');}
  else{S(8,'偽。',{cond:[a[mid-1]+' < 38',false]});S(10,'else へ → 38 はもっと左。');
   high=mid-1;st.v.high=high;st.p.a={low,high};st.dim.a=dim(low,high);S(11,'high ← '+high);}
 }
 return steps;},
quiz:[
 {q:'同じ配列 {2, 5, 8, 12, 16, 23, 38, 45} で target = 5 のとき、while の繰返しは何回目で見つかる？',c:['2回目','1回目','3回目','4回目'],e:'1回目：mid = (1+8)÷2 の商 = 4、a[4] = 12 > 5 なので high = 3。2回目：mid = (1+3)÷2 = 2、a[2] = 5 → 発見。'},
 {q:'要素数 1000 の整列済み配列を二分探索するとき、比較の回数は最大でおよそ何回？',c:['10回','100回','500回','1000回'],e:'1回ごとに範囲が半分：1000→500→250→125→63→32→16→8→4→2→1 で約10回。2¹⁰ = 1024 と覚えておくと便利。線形探索だと最大1000回。'},
 {q:'二分探索が正しく動くための前提条件は？',c:['配列が整列(昇順)されている','配列の要素数が偶数である','同じ値が含まれていない','target が必ず配列にある'],e:'「真ん中より小さいなら右にある」と判断できるのは、小さい順に並んでいるから。並んでいない配列では正しく探せない。'}
]});

/* ---------- 10 bubble ---------- */
def({id:'bubble',title:'バブルソート',sub:'隣どうしを比べて、逆なら交換',
pts:['隣り合う2つを比べ、左が大きければ交換','1周すると、最大値が右端に確定する','確定した部分は次から比べない(内側ループの終わりが i − 1)','交換は tmp に退避してから3行で行う'],
trap:'「外側ループ1回目が終わったときの配列は？」という途中経過の問題が定番。最後まで回さず、聞かれた所で止めること。',
code:L(`
○bubbleSort(整数型の配列: a)
  整数型: i, j, tmp
  for (i を aの要素数 から 2 まで 1 ずつ減らす)
    for (j を 1 から i − 1 まで 1 ずつ増やす)
      if (a[j] > a[j + 1])
        tmp ← a[j]
        a[j] ← a[j + 1]
        a[j + 1] ← tmp
      endif
    endfor
  endfor
`),
run(){const {st,S,steps}=rec();const a=[5,3,4,1],n=4;
 st.a.a=a.slice();S(0,'a = {5, 3, 4, 1} を小さい順に並べ替える。');
 st.v.i=null;st.v.j=null;st.v.tmp=null;S(1,'i, j, tmp を宣言。');
 for(let i=n;i>=2;i--){st.v.i=i;st.p.a={};
  S(2,'i = '+i+'。a[1]〜a['+i+'] の中の最大値を a['+i+'] に運ぶ周。');
  for(let j=1;j<=i-1;j++){st.v.j=j;st.p.a={j:j,'j+1':j+1};
   S(3,'j = '+j);
   st.hl.a=[j,j+1];const sw=a[j-1]>a[j];
   S(4,'a['+j+'] = '+a[j-1]+' > a['+(j+1)+'] = '+a[j]+' は'+(sw?'真 → 逆順なので交換する。':'偽 → 正しい順なのでそのまま。'),{cond:[a[j-1]+' > '+a[j],sw],arc:['a',j,j+1,'比較']});
   if(sw){const tmp=a[j-1];st.v.tmp=tmp;st.hl.a=[j];S(5,'まず a['+j+'] の '+tmp+' を tmp に退避(いきなり上書きすると消えるため)。');
    a[j-1]=a[j];st.a.a=a.slice();st.hl.a=[j];S(6,'a['+j+'] に a['+(j+1)+'] の '+a[j]+' を入れる。');
    a[j]=tmp;st.a.a=a.slice();st.hl.a=[j+1];S(7,'a['+(j+1)+'] に tmp の '+tmp+' を入れる。交換完了。',{arc:['a',j,j+1,'交換']});}
  }
  st.p.a={};st.done.a=range(i,n);S(9,'内側ループ終了。a['+i+'] = '+a[i-1]+' が確定(緑)。今の配列：{'+a.join(', ')+'}');
 }
 st.done.a=range(1,n);S(10,'完成！ {1, 3, 4, 5}');
 return steps;},
quiz:[
 {q:'a = {4, 2, 3, 1} に bubbleSort を実行したとき、外側ループの1回目(i = 4)が終わった時点の配列は？',c:['{2, 3, 1, 4}','{1, 2, 3, 4}','{2, 4, 3, 1}','{2, 1, 3, 4}'],e:'j=1：4>2 交換 → {2,4,3,1}。j=2：4>3 交換 → {2,3,4,1}。j=3：4>1 交換 → {2,3,1,4}。最大の 4 が右端に運ばれた。'},
 {q:'要素数 5 の配列で、「a[j] > a[j + 1]」の比較は全部で何回行われる？',c:['10回','5回','20回','25回'],e:'i=5 で4回、i=4 で3回、i=3 で2回、i=2 で1回。4+3+2+1 = 10回。交換があってもなくても比較回数は同じ。'}
]});

/* ---------- 11 select ---------- */
def({id:'select',title:'選択ソート',sub:'残りの中から最小を探して、先頭と交換',
pts:['i 番目以降から最小値の位置 minIdx を探す(最小値探しの応用)','見つけた最小値を a[i] と交換','これで左から1つずつ確定していく','交換は1周につき1回だけ'],
trap:'minIdx は「最小値そのもの」ではなく「最小値の番号」。a[minIdx] と minIdx を混同しないこと。',
code:L(`
○selectionSort(整数型の配列: a)
  整数型: i, j, minIdx, tmp
  for (i を 1 から aの要素数 − 1 まで 1 ずつ増やす)
    minIdx ← i
    for (j を i + 1 から aの要素数 まで 1 ずつ増やす)
      if (a[j] < a[minIdx])
        minIdx ← j
      endif
    endfor
    tmp ← a[i]
    a[i] ← a[minIdx]
    a[minIdx] ← tmp
  endfor
`),
run(){const {st,S,steps}=rec();const a=[6,2,8,1],n=4;
 st.a.a=a.slice();S(0,'a = {6, 2, 8, 1} を小さい順に並べ替える。');
 st.v.i=null;st.v.j=null;st.v.minIdx=null;st.v.tmp=null;S(1,'変数を宣言。');
 for(let i=1;i<=n-1;i++){st.v.i=i;st.v.j=null;st.p.a={i};
  S(2,'i = '+i+'。'+i+'番目に入るべき値(残りの最小)を探す。');
  let m=i;st.v.minIdx=m;st.p.a={'i,min':i};S(3,'とりあえず minIdx = '+i+'(a['+i+'] = '+a[i-1]+' を暫定の最小に)。');
  for(let j=i+1;j<=n;j++){st.v.j=j;const pp={};pp[i]=pp[i]||[];
   const lab={};lab.i=i;lab.min=m;lab.j=j;st.p.a=lab;S(4,'j = '+j);
   st.hl.a=[j,m];const t=a[j-1]<a[m-1];S(5,'a['+j+'] = '+a[j-1]+' < a['+m+'] = '+a[m-1]+' は'+(t?'真！':'偽。'),{cond:[a[j-1]+' < '+a[m-1],t],arc:['a',m,j,'比較']});
   if(t){m=j;st.v.minIdx=m;st.p.a={i:i,min:m,j:j};st.hl.a=[m];S(6,'minIdx ← '+j+'。最小の位置を更新。')}
  }
  st.p.a={i:i,min:m};
  const tmp=a[i-1];st.v.tmp=tmp;st.hl.a=[i];S(9,'tmp に a['+i+'] = '+tmp+' を退避。');
  a[i-1]=a[m-1];st.a.a=a.slice();st.hl.a=[i];S(10,'a['+i+'] に最小値 a['+m+'] = '+a[m-1]+' を入れる。');
  a[m-1]=tmp;st.a.a=a.slice();st.hl.a=[m];st.done.a=range(1,i);S(11,'a['+m+'] に tmp を入れて交換完了。'+i+'番目まで確定：{'+a.join(', ')+'}',i!==m?{arc:['a',i,m,'交換']}:{});
 }
 st.p.a={};st.done.a=range(1,n);S(12,'完成！ {1, 2, 6, 8}');
 return steps;},

/* ---------- 12 recur ---------- */
def({id:'recur',title:'再帰',sub:'関数が自分自身を呼ぶ。積み重なって、戻ってくる',
pts:['関数の中で自分自身を呼ぶのが再帰','必ず「止まる条件」(if (n ≤ 1) return 1 など)がある','呼ぶたびに箱が積み重なり、止まる条件に着いたら、上から順に戻ってくる','fact(4) = 4 × 3 × 2 × 1 = 24'],
trap:'頭の中だけで追うと必ず迷子になる。「f(4) = 4 × f(3)」「f(3) = 3 × f(2)」…と紙に縦に書いて、下から値を埋めるのがコツ。',
code:L(`
○整数型: fact(整数型: n)
  if (n ≤ 1)
    return 1
  endif
  return n × fact(n − 1)
`),
run(){const {st,S,steps}=rec();
 st.calls=['メイン: fact(4)'];S(-1,'fact(4) を呼び出す。4 の階乗(4×3×2×1)を求める関数。');
 function f(n){
  st.calls.push('fact(n='+n+')');st.v={n};S(0,'fact('+n+') の中へ。n = '+n+'。');
  if(n<=1){S(1,n+' ≤ 1 は真 → 止まる条件に到達！',{cond:[n+' ≤ 1',true]});S(2,'return 1。ここから戻り始める。');st.calls.pop();return 1}
  S(1,n+' ≤ 1 は偽。',{cond:[n+' ≤ 1',false]});
  st.calls[st.calls.length-1]='fact(n='+n+') … '+n+' × fact('+(n-1)+') の結果待ち';
  S(4,n+' × fact('+(n-1)+') を計算したい。まず fact('+(n-1)+') を呼ぶ。この fact('+n+') は途中で待機。');
  const r=f(n-1);
  st.calls[st.calls.length-1]='fact(n='+n+')';st.v={n};
  S(4,'fact('+(n-1)+') から '+r+' が返ってきた → '+n+' × '+r+' = '+(n*r)+' を return。');
  st.calls.pop();return n*r;
 }
 const r=f(4);st.v={'fact(4)':r};S(-1,'メインに戻ってきた。fact(4) = 24。');
 return steps;},
quiz:[
 {q:'f(5) の値は？',code:`○整数型: f(整数型: n)
  if (n = 0)
    return 0
  endif
  return n + f(n − 1)`,c:['15','5','10','120'],e:'f(5) = 5 + f(4) = 5 + 4 + f(3) = … = 5+4+3+2+1+0 = 15。掛け算ではなく足し算なので 120 ではない。'},
 {q:'g(5) の値は？',code:`○整数型: g(整数型: n)
  if (n < 2)
    return n
  endif
  return g(n − 1) + g(n − 2)`,c:['5','3','8','13'],e:'小さい方から作るとラク。g(0)=0, g(1)=1, g(2)=1+0=1, g(3)=1+1=2, g(4)=2+1=3, g(5)=3+2=5。フィボナッチ数列。'}
]});

def({id:'intcalc',title:'mod と ÷ の商',sub:'数の各桁を取り出す定番テクニック',
pts:['n mod 10 で「一の位」が取れる(4728 mod 10 = 8)','n ÷ 10 の商 で「一の位を消せる」(4728 → 472)','これを繰り返すと、下の桁から1つずつ取り出せる','10 を 2 にすると2進数の各桁になる'],
trap:'「÷」の後に「の商」とあれば小数点以下を切り捨て。7 ÷ 2 の商 = 3。',
code:L(`
○整数型: digitSum(整数型: n)
  整数型: s ← 0
  while (n > 0)
    s ← s + (n mod 10)
    n ← n ÷ 10 の商
  endwhile
  return s
`),
run(){const {st,S,steps}=rec();let n=4728,s=0;
 st.v.n=n;S(0,'digitSum(4728)。各桁の和 4+7+2+8 を求める。');
 st.v.s=0;S(1,'s = 0 からスタート。');
 while(true){
  if(n>0)S(2,n+' > 0 は真。',{cond:[n+' > 0',true]});else{S(2,'0 > 0 は偽 → 終了。',{cond:['0 > 0',false]});break}
  const d=n%10;s+=d;st.v.s=s;S(3,n+' mod 10 = '+d+'(一の位)。s ← '+(s-d)+' + '+d+' = '+s);
  n=Math.floor(n/10);st.v.n=n;S(4,'n ÷ 10 の商 = '+n+'。一の位が消えた。');
 }
 S(6,'return 21。');
 return steps;},
quiz:[
 {q:'n ← 13、c ← 0 で実行したとき、実行後の c は？',code:`while (n > 0)
  c ← c + (n mod 2)

endwhile`,c:['3','2','4','13'],e:'13→6→3→1→0 と変化し、そのときの n mod 2 は 1, 0, 1, 1。合計 3。13 を2進数にすると 1101 なので「1 の個数」を数えている。'},

  r ← a mod b

endwhile
return a`,c:['6','2','3','18'],e:'(48,18)→r=12→(18,12)→r=6→(12,6)→r=0→(6,0) で終了、a = 6。最大公約数を求める「ユークリッドの互除法」。'}

/* ---------- 14 stack ---------- */
def({id:'stack',title:'スタック',sub:'後から入れたものが先に出る(LIFO)',
pts:['push で上に積み、pop で一番上を取り出す','後入れ先出し＝LIFO(Last In First Out)','配列＋「top(一番上の番号)」で作れる','キューは逆で、先に入れたものが先に出る(FIFO)'],
trap:'pop しても配列から値が消えるわけではなく、top が下がるだけ。「残っているが範囲外」の値に惑わされない。',
code:L(`
大域: 整数型の配列: st  // 4つ分の箱。最初は空
大域: 整数型: top ← 0

○push(整数型: x)
  top ← top + 1
  st[top] ← x

○整数型: pop()
  整数型: x ← st[top]
  top ← top − 1
  return x

// 実行: push(3) → push(7) → pop() → push(5)
`),
run(){const {st,S,steps}=rec();const arr=[null,null,null,null];let top=0;
 const sync=()=>{st.a.st=arr.slice();st.p.st=top?{top}:{};st.dim.st=range(top+1,4)};
 st.vert=['st'];sync();S(0,'4つ分の配列 st をスタックとして使う。下が1番、上に積んでいく。');
 st.v.top=0;S(1,'top は「一番上の要素番号」。0 は「空っぽ」の意味。');
 S(12,'これから push(3) → push(7) → pop() → push(5) を順に実行する。');
 const push=x=>{st.calls=['push('+x+')'];st.v={top,x};S(3,'push('+x+') を呼ぶ。');
  top++;st.v.top=top;sync();S(4,'top を1増やして '+top+'。');
  arr[top-1]=x;sync();st.hl.st=[top];S(5,'st['+top+'] に '+x+' を積む。');st.calls=[];st.v={top}};
 const pop=()=>{st.calls=['pop()'];S(7,'pop() を呼ぶ。');
  const x=arr[top-1];st.v={top,x};st.hl.st=[top];S(8,'一番上 st['+top+'] = '+x+' を x に取り出す。');
  top--;st.v.top=top;sync();S(9,'top を減らして '+top+'。st['+(top+1)+'] の '+x+' は配列に残っているが、もうスタックの外(薄い表示)。');
  st.out=(st.out?st.out+' ':'')+x;S(10,x+' を返す。最後に入れた 7 が最初に出た(LIFO)。');st.calls=[];st.v={top}};
 push(3);push(7);pop();push(5);
 S(12,'最後の push(5) で、薄くなっていた 7 は 5 で上書きされた。スタックの中身は下から 3, 5。');
 return steps;},
quiz:[
 {q:'空のスタックに push(1), push(2), pop(), push(3), push(4), pop(), pop() の順に操作した。最後の pop() で取り出される値は？',c:['3','4','1','2'],e:'[1]→[1,2]→pop で 2→[1]→[1,3]→[1,3,4]→pop で 4→pop で 3。最後に取り出されるのは 3。'},
 {q:'空のキューに enqueue(1), enqueue(2), enqueue(3), dequeue(), enqueue(4), dequeue() の順に操作した。2回目の dequeue() で取り出される値は？(キューは先に入れたものが先に出る)',c:['2','1','3','4'],e:'キューは FIFO。1回目の dequeue で 1、2回目で 2 が出る。後から入れた 4 は最後尾に並ぶだけ。'}
]});

/* ---------- queue: 配列を回して使うFIFO ---------- */
def({id:'queue',title:'キューと環状バッファ',sub:'先に入れたものから取り出す。配列の端で折り返す',
pts:['enqueue は末尾に追加、dequeue は先頭から取り出す(FIFO)','head は次に取り出す位置、tail は次に入れる位置','tail が配列の最後に来たら先頭へ戻す(環状バッファ)','count を使うと「空」と「満杯」を区別できる'],
trap:'配列の左から右へ読む順と、キューから出る順が一致するとは限らない。必ず head から配列の端を越えて折り返す。',
code:L(`
大域: 整数型の配列: q ← {未定義, 未定義, 未定義, 未定義}
定数: N ← 4
大域: 整数型: head ← 1, tail ← 1, count ← 0
○enqueue(整数型: x)
  q[tail] ← x
  tail ← (tail mod N) + 1
  count ← count + 1
○整数型: dequeue()
  整数型: x ← q[head]
  head ← (head mod N) + 1
  count ← count − 1
  return x
`),
run(){const {st,S,steps}=rec();const N=4,q=[null,null,null,null];let head=1,tail=1,count=0,stale=[];
 const sync=()=>{st.a.q=q.slice();st.p.q={head,tail};st.dim.q=stale.slice()};
 st.v={head,tail,count};sync();S(0,'容量4の配列 q。head は次に出す位置、tail は次に入れる位置、count は中身の個数。');
 S(2,'最初は head = tail = 1、count = 0。空なので、ここから enqueue する。');
 const enqueue=x=>{
  st.calls=['メイン: enqueue('+x+')'];st.v={head,tail,count};S(3,'enqueue('+x+') を呼ぶ。末尾に追加する。');
  st.calls.push('enqueue(x='+x+')');st.v={head,tail,count,x};
  const at=tail;q[at-1]=x;stale=stale.filter(k=>k!==at);sync();st.hl.q=[at];S(4,'q['+at+'] に '+x+' を入れる。黄色の場所が今回の追加先。');
  tail=tail%N+1;count++;st.v={head,tail,count};sync();S(5,'tail ← ('+at+' mod 4) + 1 = '+tail+'。'+(at===4?'配列の端を越えたので先頭へ戻った。':'次に入れる場所へ進んだ。'));
  st.v={head,tail,count};S(6,'count を1増やして '+count+'。');st.calls.pop();
 };
 const dequeue=()=>{
  st.calls=['メイン: dequeue()'];st.v={head,tail,count};S(7,'dequeue() を呼ぶ。先頭から取り出す。');
  st.calls.push('dequeue()');const at=head,x=q[at-1];st.v={head,tail,count,x};st.hl.q=[at];S(8,'head が指す q['+at+'] の '+x+' を取り出す。最後に入れた 7 ではなく、先に入れた値が出る。');
  stale.push(at);head=head%N+1;st.v={head,tail,count,x};sync();S(9,'head ← ('+at+' mod 4) + 1 = '+head+'。読み終えた箱は薄く表示する(値は配列に残る)。');
  count--;st.v={head,tail,count,x};S(10,'count を1減らして '+count+'。');
  st.out=(st.out?st.out+' → ':'')+x;S(11,x+' を取り出した。');st.calls.pop();
 };
 enqueue(3);enqueue(7);enqueue(5);dequeue();enqueue(9);dequeue();enqueue(2);enqueue(6);
 S(-1,'最後は head = tail = 3 でも count = 4。空ではなく満杯。取り出す順は head から 5 → 9 → 2 → 6。配列の端を越えると先頭へ回る。');
 return steps;},
quiz:[
 {q:'空のキューに enqueue(4), enqueue(6), dequeue(), enqueue(8), dequeue() と操作した。2回目に取り出される値は？',c:['6','4','8','未定義'],e:'キューは FIFO。1回目の dequeue で先に入れた 4 が出る。次に出るのは 6。'},
 {q:'容量4の環状キューで tail = 4 のとき、1つ追加した後の tail は？(tail ← (tail mod 4) + 1)',c:['1','4','0','5'],e:'(4 mod 4) + 1 = 1。配列の最後の次は先頭へ戻る。'}}
]});

def({id:'list',title:'連結リスト',sub:'「次はどこ？」をたどって進む',
pts:['各要素が「次の要素の番号(next)」を持っている','先頭から next をたどると、順番に読める','0(や「未定義」)が来たら終わり','並べ替えずに、next の書き換えだけで挿入・削除ができる'],
trap:'配列の並び順(1,2,3,4番目)と、リストとしての順番は別物。必ず next をたどる。',
code:L(`
整数型の配列: val  ← {30, 10, 40, 20}
整数型の配列: next ← {3, 4, 0, 1}
整数型: p ← 2   // 先頭は要素番号 2
while (p ≠ 0)
  val[p] を出力する
  p ← next[p]
endwhile
`),
run(){const {st,S,steps}=rec();const val=[30,10,40,20],nx=[3,4,0,1];let p=2;
 st.chain={nodes:[[2,10],[4,20],[1,30],[3,40]],cur:null,seen:[]};st.a.val=val.slice();S(0,'値を入れた配列 val。この並び順はリストの順番ではない。');
 st.a.next=nx.slice();S(1,'next[k] は「k番目の次は何番目か」。0 は「次は無い(終わり)」。');
 st.v.p=p;st.chain.cur=p;st.p.val={p};st.p.next={p};S(2,'p = 2 から始める(先頭は2番目)。');
 const out=[];
 while(true){
  if(p!==0)S(3,'p = '+p+' ≠ 0 は真。',{cond:[p+' ≠ 0',true]});else{S(3,'p = 0 なので終了。',{cond:['0 ≠ 0',false]});break}
  out.push(val[p-1]);st.chain.seen.push(p);st.out=out.join(' → ');st.hl.val=[p];S(4,'val['+p+'] = '+val[p-1]+' を出力。');
  st.hl.next=[p];const old=p,q=nx[p-1];p=q;st.v.p=p;st.chain.cur=p||null;st.p.val=p?{p}:{};st.p.next=p?{p}:{};
  S(5,'p ← next['+old+'] = '+q+'。'+(q?q+'番目へジャンプ。':'0 なのでもう次は無い。'));
 }
 S(6,'出力は 10 → 20 → 30 → 40。配列の順番(30,10,40,20)とは違う順でたどれた。');
 return steps;},
quiz:[
 {q:'上のリスト(10 → 20 → 30 → 40)で、20(要素番号4)の後ろに、要素番号5に入れた新しい値 25 をつなぎたい。正しい手順は？',c:['next[5] ← next[4] の後に next[4] ← 5','next[4] ← 5 の後に next[5] ← next[4]','next[5] ← 4 の後に next[4] ← 5','next[4] ← 5 だけでよい'],e:'先に「25 の次 ＝ 20 の元の次(30)」をつないでおき、その後で「20 の次 ＝ 25」に書き換える。順番を逆にすると next[4] が 5 に上書きされて、30 への道が消える。'},
 {q:'同じリストから 20(要素番号4)を取り除きたい。どの代入をすればよい？',c:['next[2] ← next[4]','next[4] ← 0','next[2] ← 0','next[1] ← next[4]'],e:'20 の直前は 10(要素番号2)。10 の次を「20 の次(30)」にすれば、20 を飛ばしてたどるようになる。next[2] ← 0 だとリストが 10 で終わってしまう。'}
]});

def({id:'sec',title:'情報セキュリティ4問の取り方',sub:'問17〜20。知識＋「組織としてどう動くか」',

quiz:[

function ln(d,c,w,dash){return '<path d="'+d+'" style="fill:none;stroke:'+(c||CV.mute)+';stroke-width:'+(w||1.8)+(dash?';stroke-dasharray:4 3':'')+'"/>'}
function rc(x,y,w,h,f,e,r){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r==null?4:r)+'" style="fill:'+(f||CV.tile)+';stroke:'+(e||CV.line)+';stroke-width:1.5"/>'}
function cells(x,y,vals,o){o=o||{};const w=o.w||26,h=o.h||24,g=o.g==null?2:o.g;return vals.map((v,i)=>{const st=(o.st&&o.st[i])||'';const f=st==='a'?CV.ambS:st==='g'?CV.accS:st==='d'?CV.bg:st==='ok'?CV.okSoft:st==='ng'?CV.ngSoft:CV.tile;const e=st==='a'?CV.amb:st==='g'?CV.acc:st==='ok'?CV.ok:st==='ng'?CV.ng:CV.line;
 return rc(x+i*(w+g),y,w,h,f,e,3)+tx(x+i*(w+g)+w/2,y+h/2+4,v,{s:o.s||12,w:700,m:true,c:st==='d'?CV.mute:CV.ink})}).join('')}
function ttab(x,y,head,rows){const w=30,h=17;let s='';head.forEach((t,c)=>{s+=rc(x+c*w,y,w,h,CV.bg,CV.line,0)+tx(x+c*w+w/2,y+12,t,{s:9,w:700})});
 rows.forEach((r,i)=>r.forEach((t,c)=>{const last=c===r.length-1;s+=rc(x+c*w,y+(i+1)*h,w,h,last?(t==='真'?CV.okSoft:CV.ngSoft):CV.tile,CV.line,0)+tx(x+c*w+w/2,y+(i+1)*h+12,t,{s:10,w:last?700:500,c:t==='真'?CV.ok:CV.ng})}));return s}

/* ---- trace table ---- */
function traceTable(steps,cur){
 const cols=[];steps.forEach(st=>Object.keys(st.s.v).forEach(k=>{if(!cols.includes(k))cols.push(k)}));
 const hasCond=steps.some(st=>st.x&&st.x.cond);
 let h='<table class="tt"><thead><tr><th>行</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(hasCond?'<th>判定</th>':'')+'</tr></thead><tbody>';
 for(let k=0;k<=cur;k++){const st=steps[k],pv=k>0?steps[k-1].s.v:{};
  const any=cols.some(c=>(c in st.s.v)&&JSON.stringify(st.s.v[c])!==JSON.stringify(pv[c]));
  if(!any&&!(st.x&&st.x.cond)&&k!==cur)continue;
  h+='<tr class="'+(k===cur?'now':'')+'"><td class="lno">'+(st.line>=0?st.line+1:'—')+'</td>';
  cols.forEach(c=>{const has=c in st.s.v,v=st.s.v[c],chg=has&&JSON.stringify(v)!==JSON.stringify(pv[c]);
   h+='<td class="'+(chg?'chg':'same')+'">'+(has&&(chg||k===cur)?esc(fmt(v)):(has?'<span class="dot">〃</span>':''))+'</td>'});
  if(hasCond)h+='<td>'+(st.x&&st.x.cond?'<span class="'+(st.x.cond[1]?'tt-t':'tt-f')+'">'+(st.x.cond[1]?'真':'偽')+'</span>':'')+'</td>';
  h+='</tr>';}
 return h+'</tbody></table>';
}

function runQuiz(qs,{title,small,lessonId,back}){
 stopTimer();keyHandler=null;
 if(!qs.length){app.innerHTML=topbar(small,title,back)+'<div class="wrap"><div class="empty-note">間違えた問題はまだありません 🎉<br>レッスンかドリルを解くと、ここに溜まります。</div></div>';ctrl.innerHTML='';return}
 const st={i:0,res:[]};
 function render(){
  const q=qs[st.i];
  const opts=shuffle(q.c.map((t,k)=>({t,ok:k===0})));
  let h=topbar(small,title,back)+'<div class="wrap">';
  h+='<div class="qhead"><span>問 '+(st.i+1)+' / '+qs.length+(lessonId?'':'　・ '+esc(q.from))+'</span><span class="dots">'+qs.map((_,k)=>'<i class="'+(k<st.i?(st.res[k]?'ok':'ng'):k===st.i?'now':'')+'"></i>').join('')+'</span></div>';
  h+='<div class="qtext">'+esc(q.q).replace(/\n/g,'<br>')+'</div>';
  if(q.code)h+='<div class="qcode">'+q.code.split('\n').map(hi).join('\n')+'</div>';
  h+='<div class="choices">'+opts.map((o,k)=>'<button class="ch" data-k="'+k+'"><span class="lb">'+KANA[k]+'</span><span class="tx">'+esc(o.t)+'</span></button>').join('')+'</div><div id="exp"></div></div>';
  app.innerHTML=h;ctrl.innerHTML='';window.scrollTo(0,0);
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k,ok=opts[k].ok;st.res[st.i]=ok;
   app.querySelectorAll('.ch').forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('ok');else if(j===k)x.classList.add('ng')});
   if(ok)P.wrong=P.wrong.filter(x=>x!==q.id);else if(!P.wrong.includes(q.id))P.wrong.push(q.id);save();
   document.getElementById('exp').innerHTML='<div class="exp"><span class="v '+(ok?'ok':'ng')+'">'+(ok?'正解！':'ざんねん。正解は「'+esc(q.c[0])+'」')+'</span>'+esc(q.e)+(TT[q.id]?'<div class="vlabel" style="margin-top:10px">トレース表</div>'+miniTable(TT[q.id]):'')+'</div>'+termFigHTML(q,lessonId||q.id.split('-')[0]);
   const last=st.i===qs.length-1;
   ctrl.innerHTML='<div class="ctrl"><div class="in"><button class="cb main" id="qn">'+(last?'結果を見る':'次の問題 →')+'</button></div></div>';
   document.getElementById('qn').onclick=()=>{if(last)finish();else{st.i++;render()}};
   document.getElementById('exp').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
 }
 function finish(){
  const sc=st.res.filter(Boolean).length;
  if(lessonId){P.done[lessonId]=true;P.best[lessonId]=Math.max(P.best[lessonId]||0,sc)}
  P.hist.unshift({ts:Date.now(),t:lessonId?LESSONS[lessonId].title:title,k:lessonId?'lesson':title,s:sc,n:qs.length});if(P.hist.length>300)P.hist.length=300;
  markDay();save();
  const nextId=lessonId?ORDER[ORDER.indexOf(lessonId)+1]:null;
  const msg=sc===qs.length?'全問正解！ この調子。':sc>=qs.length*0.6?'合格ライン。間違えた問題は「復習」に入っています。':'もう一度ステップ実行を見直すと、つかめるはず。';
  app.innerHTML=topbar(small,title,back)+'<div class="wrap"><div class="result"><div class="rlabel">結果</div><div class="big">'+sc+' / '+qs.length+'</div><p>'+msg+'</p></div></div>';
  let b='';
  if(lessonId&&LESSONS[lessonId].run)b+='<button class="cb" style="flex:1" onclick="go(\''+lessonId+'\')">レッスンを見直す</button>';
  if(nextId)b+='<button class="cb main" onclick="go(\''+nextId+'\')">次のレッスン：'+esc(LESSONS[nextId].title)+'</button>';
  else b+='<button class="cb main" onclick="go(\'home\')">ホームへ</button>';
  ctrl.innerHTML='<div class="ctrl"><div class="in">'+b+'</div></div>';
 }
 render();
}

/* ---- 模擬試験 ---- */
let mockTimer=null;function stopMock(){if(mockTimer){clearInterval(mockTimer);mockTimer=null}}
function viewMoshiStart(){
 stopTimer();keyHandler=null;ctrl.innerHTML='';
 const best=P.mock||{};
 let h=topbar('模擬試験','時間を計って本番の練習')+'<div class="wrap">';
 h+='<div class="card prose"><p>本番の科目Bは<b>20問を100分</b>、つまり<b>1問5分</b>のペースです。時間を計りながら解くと、「1問に粘りすぎる」クセがわかります。</p><ul><li>答えは途中で変えられます。問題の行き来も自由</li><li>解説は最後にまとめて表示</li><li>時間切れになると自動で採点</li></ul></div>';
 h+='<div class="mopts">'+
  '<button class="mopt" data-n="5" data-m="25"><b>ミニ模試</b><span>5問・25分</span><small>アルゴリズム4＋セキュリティ1</small>'+(best['5']!=null?'<i>最高 '+best['5']+'/5</i>':'')+'</button>'+
  '<button class="mopt big" data-n="20" data-m="100"><b>本番模試</b><span>20問・100分</span><small>アルゴリズム16＋セキュリティ4(本番と同じ比率)</small>'+(best['20']!=null?'<i>最高 '+best['20']+'/20</i>':'')+'</button></div></div>';
 app.innerHTML=h;
 app.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>runMock(+b.dataset.n,+b.dataset.m));

function runMock(n,mins){
 const algo=shuffle(Object.values(BANK).filter(q=>q.cat==='algo')),sec=shuffle(Object.values(BANK).filter(q=>q.cat==='sec'));
 const ns=Math.round(n/5);const qs=algo.slice(0,n-ns).concat(sec.slice(0,ns));
 const M={qs,opts:qs.map(q=>shuffle(q.c.map((t,k)=>({t,ok:k===0})))),ans:qs.map(()=>null),spent:qs.map(()=>0),i:0,end:Date.now()+mins*60000,last:Date.now(),n,mins};
 const tick=()=>{const now=Date.now();M.spent[M.i]+=now-M.last;M.last=now;const left=Math.max(0,M.end-now);
  const el=document.getElementById('mclock');if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=m+':'+String(s).padStart(2,'0');
   const ideal=mins*60000*(1-(M.ans.filter(a=>a!==null).length)/n);const pace=document.getElementById('mpace');
   if(pace){const diff=Math.round((left-ideal)/60000);pace.textContent=diff>=0?'ペース：目安より '+diff+'分 余裕':'ペース：目安より '+(-diff)+'分 遅れ';pace.className='mpace '+(diff>=0?'ok':'ng')}
   document.getElementById('mbar').style.width=(left/(mins*60000)*100)+'%';}
  if(left<=0){stopMock();finishMock(M,true)}};
 const render=()=>{const q=M.qs[M.i],o=M.opts[M.i];
  let h='<div class="mtop"><div class="in"><b id="mclock" class="mono"></b><span id="mpace" class="mpace"></span><button class="msub" id="msub">提出</button></div><div class="mbarw"><i id="mbar"></i></div></div><div class="wrap">';
  h+='<div class="qhead"><span>問 '+(M.i+1)+' / '+n+'　・ '+(q.cat==='sec'?'セキュリティ':'アルゴリズム')+'</span></div>';
  h+='<div class="qtext">'+esc(q.q).replace(/\n/g,'<br>')+'</div>';
  if(q.code)h+='<div class="qcode">'+q.code.split('\n').map(hi).join('\n')+'</div>';
  h+='<div class="choices">'+o.map((c,k)=>'<button class="ch'+(M.ans[M.i]===k?' sel':'')+'" data-k="'+k+'"><span class="lb">'+KANA[k]+'</span><span class="tx">'+esc(c.t)+'</span></button>').join('')+'</div>';
  h+='<div class="pal">'+M.qs.map((_,k)=>'<button class="'+(k===M.i?'now ':'')+(M.ans[k]!==null?'done':'')+'" data-j="'+k+'">'+(k+1)+'</button>').join('')+'</div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  ctrl.innerHTML='<div class="ctrl"><div class="in"><button class="cb" id="mprev" style="flex:1">◀ 前の問題</button><button class="cb main" id="mnext">'+(M.i===n-1?'見直して提出':'次の問題 ▶')+'</button></div></div>';
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{M.ans[M.i]=+b.dataset.k;app.querySelectorAll('.ch').forEach(x=>x.classList.toggle('sel',x===b));const p=app.querySelector('.pal [data-j="'+M.i+'"]');if(p)p.classList.add('done')});
  app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{M.i=+b.dataset.j;render()});
  document.getElementById('mprev').onclick=()=>{if(M.i>0){M.i--;render()}};
  document.getElementById('mnext').onclick=()=>{if(M.i<n-1){M.i++;render()}else confirmSubmit()};
  document.getElementById('msub').onclick=confirmSubmit;tick();};
 const confirmSubmit=()=>{const un=M.ans.filter(a=>a===null).length;
  ctrl.innerHTML='<div class="ctrl"><div class="in" style="flex-direction:column;align-items:stretch;gap:6px"><div class="msg" style="min-height:0">'+(un?'<b style="color:var(--ng)">未回答が '+un+'問</b> あります。':'全問回答済みです。')+'提出して採点しますか？</div><div style="display:flex;gap:8px"><button class="cb" id="mback" style="flex:1">戻る</button><button class="cb amb" id="mgo">提出する</button></div></div></div>';
  document.getElementById('mback').onclick=render;document.getElementById('mgo').onclick=()=>{stopMock();finishMock(M,false)}};
 stopTimer();keyHandler=null;setTabs(null);render();mockTimer=setInterval(tick,1000);
}
function finishMock(M,timeup){
 const res=M.qs.map((q,k)=>M.ans[k]!==null&&M.opts[k][M.ans[k]].ok);
 const sc=res.filter(Boolean).length;const used=Math.round(M.spent.reduce((a,b)=>a+b,0)/60000);
 const byCat=c=>{const ix=M.qs.map((q,k)=>k).filter(k=>M.qs[k].cat===c);return [ix.filter(k=>res[k]).length,ix.length]};
 const [aO,aN]=byCat('algo'),[sO,sN]=byCat('sec');
 M.qs.forEach((q,k)=>{if(res[k])P.wrong=P.wrong.filter(x=>x!==q.id);else if(!P.wrong.includes(q.id))P.wrong.push(q.id)});
 P.mock=P.mock||{};P.mock[M.n]=Math.max(P.mock[M.n]||0,sc);
 setTabs(null);P.hist.unshift({ts:Date.now(),t:(M.n===20?'本番模試':'ミニ模試'),k:'mock',s:sc,n:M.n});if(P.hist.length>300)P.hist.length=300;markDay();save();
 const pct=sc/M.n;
 let h=topbar('模擬試験','結果')+'<div class="wrap"><div class="result">'+(timeup?'<div class="rlabel" style="color:var(--ng)">時間切れ</div>':'<div class="rlabel">結果</div>')+'<div class="big">'+sc+' / '+M.n+'</div><p>'+(pct>=.8?'すばらしい！ 本番でも十分戦えるペースです。':pct>=.6?'合格ラインの目安(6割強)に届いています。':'まずは間違えた問題のレッスンと図解を見直そう。')+'</p></div>';
 h+='<div class="kstats"><div class="ks"><b>'+aO+'<small>/'+aN+'</small></b><span>アルゴリズム</span></div><div class="ks"><b>'+sO+'<small>/'+sN+'</small></b><span>セキュリティ</span></div><div class="ks"><b>'+used+'<small>分</small></b><span>使った時間 / '+M.mins+'分</span></div></div>';
 h+='<div class="vlabel">1問ずつの見直し(かかった時間つき。5分を超えた問題は⏱)</div>';
 M.qs.forEach((q,k)=>{const sec=Math.round(M.spent[k]/1000),o=M.opts[k],a=M.ans[k];
  h+='<details class="mrev '+(res[k]?'ok':'ng')+'"><summary><span class="mk">'+(res[k]?'○':'✕')+'</span><span class="mq">問'+(k+1)+'　'+esc(q.q.split('\n')[0]).slice(0,40)+'</span><span class="mt">'+(sec>=300?'⏱':'')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+'</span></summary>'+
   (q.code?'<div class="qcode">'+q.code.split('\n').map(hi).join('\n')+'</div>':'')+
   '<p class="mya">あなたの答え：'+(a===null?'<b style="color:var(--ng)">未回答</b>':esc(o[a].t))+'</p><p class="mca">正解：<b>'+esc(q.c[0])+'</b></p><p>'+esc(q.e)+'</p>'+(TT[q.id]?miniTable(TT[q.id]):'')+termFigHTML(q,q.id.split('-')[0])+'</details>'});
 h+='</div>';app.innerHTML=h;window.scrollTo(0,0);
 ctrl.innerHTML='<div class="ctrl"><div class="in"><button class="cb" style="flex:1" onclick="go(\'review\')">間違えた問題を復習</button><button class="cb main" onclick="go(\'moshi\')">もう一度</button></div></div>';
}

function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function route(){
 stopTimer();stopMock();keyHandler=null;window.scrollTo(0,0);
 const h=(location.hash||'').slice(1)||'home';
 const TABMAP={home:'home',zukan:'zukan',yougo:'zukan',cheat:'zukan',guide:'zukan',moshi:'moshi',kiroku:'kiroku'};
 setTabs(h.startsWith('z-')?'zukan':TABMAP[h]!==undefined?TABMAP[h]:(LESSONS[h]||h.startsWith('quiz-')||['drill','review','daily'].includes(h)?null:'home'));
 if(LESSONS[h])return viewLesson(h);
 if(h.startsWith('quiz-')&&LESSONS[h.slice(5)]){const id=h.slice(5);const l=LESSONS[id];return runQuiz(l.quiz,{title:l.title,small:'確認問題',lessonId:id,back:id})}
 if(h==='drill')return runQuiz(shuffle(Object.values(BANK).filter(q=>q.cat!=='intro')).slice(0,10),{title:'実戦ドリル',small:'ランダム10問'});
 if(h==='review')return runQuiz(shuffle(P.wrong.filter(id=>BANK[id]).map(id=>BANK[id])),{title:'復習',small:'間違えた問題'});
 if(h==='cheat')return viewCheat();
 if(h==='kiroku')return viewKiroku();
 if(h==='guide')return viewGuide();
 if(h==='moshi')return viewMoshiStart();
 if(h==='daily'){const q=dailyQ();return runQuiz([q],{title:'今日の1問',small:dkey().replace(/-/g,'/')})}
 if(h==='zukan')return viewZukan();
 if(h==='yougo')return viewYougo();
 if(h.startsWith('z-'))return viewZukan(h.slice(2));
 viewHome();
}
window.addEventListener('hashchange',route);
route();
